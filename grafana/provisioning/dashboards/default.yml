# ===================================================================
# Dashboard Provisioning
# ===================================================================
# Este arquivo configura o Grafana para carregar automaticamente todos
# os dashboards em formato JSON da pasta /var/lib/grafana/dashboards.
#
# Referência oficial:
# https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
# ===================================================================

apiVersion: 1

providers:
  - name: 'Industrial Streaming Lab'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
